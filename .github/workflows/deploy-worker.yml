name: Deploy research Worker

# Sets up the paid "Run Research" button end to end: deploys the Worker, loads
# its secrets, and writes the deployed URL into web/data/site.json so the page
# starts using it. Run this once; re-run after changing worker/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the required secrets are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASS: ${{ secrets.RESEARCH_PASSPHRASE }}
          GH_PAT: ${{ secrets.WORKER_GITHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$PASS" ]      && missing="$missing RESEARCH_PASSPHRASE"
          [ -z "$GH_PAT" ]    && missing="$missing WORKER_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          echo "all four secrets present"

      - name: Deploy the Worker
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::could not read the deployed URL from wrangler output"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed to $url"

      - name: Load the Worker's secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.RESEARCH_PASSPHRASE }}" \
            | npx --yes wrangler@4 secret put RESEARCH_PASSPHRASE
          printf '%s' "${{ secrets.WORKER_GITHUB_TOKEN }}" \
            | npx --yes wrangler@4 secret put GITHUB_TOKEN
          echo "secrets loaded"

      - name: Point the dashboard at the Worker
        run: |
          node -e '
            const fs = require("fs");
            const p = "web/data/site.json";
            const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
            cfg.workerUrl = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
            console.log("workerUrl =", cfg.workerUrl);
          ' "${{ steps.deploy.outputs.url }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/site.json
          if git diff --staged --quiet; then
            echo "site.json already pointed at this Worker"
            exit 0
          fi
          git commit -m "config: point Run Research at the deployed Worker"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin ${{ github.ref_name }} && \
               git push origin HEAD:${{ github.ref_name }}; then
              pushed=1; break
            fi
            echo "push attempt $i failed; retrying"; sleep $((2 ** i))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::could not push the updated site.json"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Research Worker deployed"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- The Run Research button on the dashboard now triggers real runs."
            echo "- Guarded by RESEARCH_PASSPHRASE and a daily run cap."
          } >> "$GITHUB_STEP_SUMMARY"
