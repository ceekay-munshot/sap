name: Preflight (check the keys)

# Works out which provider the supplied key belongs to and which Firecrawl
# version answers. Prints key prefixes and lengths only, never a key.
on:
  workflow_dispatch:
    inputs:
      press_button:
        description: 'Also press Run Research for real on one topic (costs money)'
        required: false
        default: false
        type: boolean
      topic:
        description: 'Which topic to press it for'
        required: false
        default: 'data-readiness'
        type: string

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDKs
        run: npm install --no-audit --no-fund

      - name: Probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: node collector/preflight.mjs

      # Off by default: the checks above cost a fraction of a cent, this starts
      # a real research pass.
      - name: Press the button for real
        if: ${{ inputs.press_button }}
        env:
          TOPIC: ${{ inputs.topic }}
          RESEARCH_PASSPHRASE: ${{ secrets.RESEARCH_PASSPHRASE }}
        run: node collector/buttontest.mjs
