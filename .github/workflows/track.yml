name: Track sentiment & telemetry (free, daily)

on:
  schedule:
    - cron: '0 6 * * *'        # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      only:
        description: 'Run a single source (hackernews, reddit, stackexchange, rss, youtube, vendorpages)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/track.yml'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Self-test the pipeline
        run: node collector/selftest.mjs

      # Skipped on a plain push to web/ — that path only needs the deploy below.
      # Free: scrapes public sources, no API key, no cost.
      - name: Track sentiment
        if: github.event_name != 'push'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node collector/track.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }}

      # Rebuild the weekly history from the enriched corpus. Live points are
      # never overwritten; only the reconstructed ones are recomputed.
      - name: Rebuild weekly history
        if: github.event_name != 'push'
        run: node collector/backfill.mjs

      - name: Commit the day's data
        if: github.event_name != 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # npm can touch the manifests; a dirty tree makes the rebase refuse.
          git checkout -- package.json package-lock.json 2>/dev/null || true
          git add data web/data
          if git diff --staged --quiet; then
            echo "no change in collected data"
          else
            git commit -m "data: tracking run $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
              echo "push attempt $i failed; retrying"; sleep $((2 ** i))
            done
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-data
          path: |
            web/data/trend.json
            data/track-report.json
          if-no-files-found: warn

      # Optional: publish to Cloudflare Pages. Skipped entirely unless both
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'sap-dashboard' }}
        run: npx --yes wrangler@4 pages deploy web --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
