<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP AI Intelligence</title>
<meta name="description" content="Numerical practitioner-sentiment scores and verbatim quotes on SAP's AI strategy, recency-weighted and refreshed daily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>⬡</text></svg>">
</head>
<body>

<!-- NAV -->
<nav class="nav" id="nav">
  <div class="nav-logo">⬡</div>
  <span class="nav-title">SAP AI INTELLIGENCE</span>
  <span class="nav-divider">|</span>
  <span class="nav-sub">PRACTITIONER SENTIMENT TRACKER</span>
  <div class="nav-right" id="navRight">
    <span class="nav-sub" id="coverage">0/9</span>
    <button class="theme-toggle" id="themeToggle" type="button" title="Toggle light/dark mode">
      <span class="theme-toggle-icon" id="themeIcon">🌙</span>
      <span id="themeLabel">DARK</span>
    </button>
  </div>
</nav>

<!-- MOBILE NAV -->
<div class="mobile-nav" id="mobileNav" aria-label="Mobile Navigation">
  <div class="mobile-nav-scroll" id="mobileFilters"></div>
</div>

<!-- LAYOUT -->
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div style="margin-bottom:18px">
      <h1 class="sidebar-title">SAP AI<br>Intel</h1>
      <p class="sidebar-sub">Numerical sentiment scores + practitioner quotes</p>
    </div>

    <div id="serverStatus" style="background:var(--tracker-bg);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;margin-bottom:14px;display:flex;align-items:center;gap:7px">
      <div id="statusDot" style="width:7px;height:7px;border-radius:50%;background:var(--text5);flex-shrink:0"></div>
      <span id="statusText" style="font-size:10px;color:var(--text3);font-family:'DM Mono',monospace">CHECKING STATUS…</span>
    </div>

    <div id="miniTracker"></div>

    <div style="margin-bottom:16px">
      <div class="section-label">FILTER</div>
      <div id="categoryFilters"></div>
    </div>

    <div style="margin-top:14px">
      <div class="section-label">TOPICS</div>
      <div id="topicList"></div>
    </div>

    <div style="margin-top:16px">
      <div class="section-label">WEIGHTING</div>
      <div id="weightKey"></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main"></main>
</div>

<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>

<!-- Filled when a reader clicks a week open; empty the rest of the time. -->
<div class="evidence" id="evidence"></div>
<script type="module" src="./assets/app.js"></script>
</body>
</html>
